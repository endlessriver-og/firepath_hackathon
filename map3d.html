<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FirePath 3D map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  :root { --ink: #17372E; --muted: #64756E; --green: #1D5B4D; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #E6EFE9; }
  #map { position: absolute; inset: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .panel { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .panel > * { pointer-events: auto; }
  select, button { font: 700 14px/1 inherit; color: var(--ink); background: #FFF; border: 1px solid #C9D4CC; border-radius: 12px; padding: 9px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  button { cursor: pointer; }
  #legend { position: absolute; left: 10px; bottom: 28px; max-width: min(250px, calc(100% - 70px)); background: rgba(255,255,255,.94); border-radius: 12px; padding: 10px 12px; font-size: 12px; line-height: 1.4; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  #legend b { font-size: 11px; letter-spacing: .08em; color: #367363; }
  .ramp { height: 8px; border-radius: 4px; margin: 5px 0; background: linear-gradient(90deg,#F5CF4A,#E8641E,#B3261A); }
  .home { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); border: 3px solid #FFF; box-shadow: 0 0 0 6px rgba(232,100,30,.35); }
  @media (max-width: 500px) { #legend .fine { display: none; } #legend { bottom: 10px; } .maplibregl-ctrl-bottom-right { margin-bottom: 0; } }
  #card { display: none; z-index: 5; position: absolute; right: 10px; top: 58px; width: 320px; max-height: calc(100% - 110px); overflow: auto; background: #FFF; border-radius: 16px; padding: 14px 16px; font-size: 13px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.22); }
  #card h2 { margin: 0 26px 2px 0; font-size: 16px; line-height: 1.25; }
  #card .k { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; color: #367363; margin-top: 12px; }
  #card .muted { color: var(--muted); }
  #card .x { position: absolute; right: 8px; top: 6px; border: 0; box-shadow: none; font-size: 20px; padding: 4px 8px; background: none; }
  #card .score { display: inline-block; font-weight: 900; color: #FFF; border-radius: 8px; padding: 2px 8px; margin-right: 6px; }
  #card .row { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid #EDF1ED; padding: 4px 0; }
  #card a { color: #086B56; font-weight: 700; }
  #card .note { background: #FFF6EC; border-left: 3px solid #E8641E; border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
  #hint { position: absolute; left: 50%; transform: translateX(-50%); top: 58px; background: rgba(23,55,46,.88); color: #FFF; border-radius: 20px; padding: 6px 12px; font: 700 12px/1.2 inherit; pointer-events: none; transition: opacity .6s; }
  @media (max-width: 500px) { #card { left: 8px; right: 8px; width: auto; top: auto; bottom: 8px; max-height: 36%; } }
  #fallback { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; }
</style>
</head>
<body>
<main>
<h1 class="sr">FirePath Glendale 3D map</h1>
<div id="map" role="region" aria-label="Glendale 3D hazard map"></div>
<div class="panel">
  <select id="layer" aria-label="Hazard layer"></select>
  <button id="spin" aria-pressed="false">Orbit</button>
  <button id="reset">Recenter</button>
</div>
<div id="legend" aria-live="polite"></div>
<div id="hint">Tap any building or lot to inspect it</div>
<div id="card" role="dialog" aria-label="Parcel details" aria-live="polite"></div>
<div id="fallback"><div><b>3D needs WebGL, which this browser has turned off.</b><br>The flat map shows the same hazard zones.</div></div>
</main>

  throw new Error('No WebGL');
}

const map = new maplibregl.Map({
  locale: { 'Map.Title': tr('Map. Arrow keys pan; press Enter to inspect the lot at the centre.') },
  container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty',
  center: view.center, zoom: view.zoom - 2.5, pitch: 0, bearing: 0, maxPitch: 80, attributionControl: { compact: true },
});
map.on('load', () => document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show'));
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

async function combinedGeo() {
  const c = await fetch(`${base}/map-layers/combined.json`).then(r => r.json());
  const half = c.grid_m / 2, dLat = half / 110540, dLon = half / (111320 * Math.cos(34.17 * Math.PI / 180));
  return { type: 'FeatureCollection', features: c.cells.map(([y, x, score]) => ({ type: 'Feature', properties: { t: score / c.max }, geometry: { type: 'Polygon', coordinates: [[[x - dLon, y - dLat], [x + dLon, y - dLat], [x + dLon, y + dLat], [x - dLon, y + dLat], [x - dLon, y - dLat]]] } })) };
}

async function show(key) {
  current = key;
  if (map.getLayer('hazard')) map.removeLayer('hazard');
  if (map.getLayer('hazard-line')) map.removeLayer('hazard-line');
  if (map.getLayer('hazard-label')) map.removeLayer('hazard-label');
  if (map.getSource('hazard')) map.removeSource('hazard');
  const data = key === 'combined' ? await combinedGeo() : await fetch(`${base}/map-layers/${key}.geojson`).then(r => r.json());
  if (key !== current) return;
  map.addSource('hazard', { type: 'geojson', data });
  const before = map.getLayer('building-3d') ? 'building-3d' : undefined;
  if (key === 'combined') {
    map.addLayer({ id: 'hazard', type: 'fill', source: 'hazard', paint: {
      'fill-color': ['interpolate', ['linear'], ['get', 't'], 0, '#F5CF4A', 0.5, '#E8641E', 1, '#B3261A'],
      'fill-opacity': ['interpolate', ['linear'], ['get', 't'], 0, 0.12, 1, 0.55] } }, before);
  } else {
    const colors = LAYERS[key].colors, match = ['match', ['to-string', ['get', 'level']]];
    for (const [lvl, c] of Object.entries(colors)) match.push(lvl, c);
    match.push(Object.values(colors)[0]);
    const spec = LAYERS[key];
    map.addLayer({ id: 'hazard', type: 'fill', source: 'hazard', paint: { 'fill-color': match, 'fill-opacity': spec.outlineOnly ? 0.06 : 0.5 } }, before);
    map.addLayer({ id: 'hazard-line', type: 'line', source: 'hazard', paint: { 'line-color': match, 'line-width': spec.outlineOnly ? 3 : 1.5 } }, before);
    if (spec.labels) map.addLayer({ id: 'hazard-label', type: 'symbol', source: 'hazard', layout: { 'text-field': ['get', 'label'], 'text-font': ['Noto Sans Bold'], 'text-size': 12, 'symbol-placement': 'point', 'text-max-width': 9 }, paint: { 'text-color': spec.colors.zone, 'text-halo-color': '#FFFFFF', 'text-halo-width': 2 } });
  }
  legend();
  parent?.postMessage?.({ type: 'firepath-map-layers', layers: [key] }, '*');
}

function legend() {
  const spec = LAYERS[current];
  const body = current === 'combined'
    ? `<b>${tr('COMBINED PLANNING INDEX')}</b><div class="ramp"></div>${tr('lower → higher')}<span class="fine"> · ${tr('illustrative weights, not an official score')}</span>`
    : `<b>${tr(spec.name).toUpperCase()}</b>` + Object.entries(spec.levels).map(([l, t]) => `<div><span style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:${spec.colors[l]}"></span>${tr(t)}</div>`).join('') + (spec.note ? `<div class="fine" style="margin-top:3px">${tr(spec.note)}</div>` : '');
  document.getElementById('legend').innerHTML = body + (spec.civic ? `<div style="color:#64756E;margin-top:4px;font-size:11px">${tr('From the City of Glendale public GIS.')}</div>` : '<div style="color:#64756E;margin-top:4px;font-size:11px">' + tr('Planning map, not a live incident or evacuation order.') + '<span class="fine"> ' + tr('Building heights approximate (OpenStreetMap).') + '</span></div>');
}

map.on('load', async () => {
  map.addSource('dem', { type: 'raster-dem', tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], encoding: 'terrarium', tileSize: 256, maxzoom: 14, attribution: 'Terrain: Mapzen / AWS Open Data' });
  map.setTerrain({ source: 'dem', exaggeration: 1.2 });
  map.addLayer({ id: 'hills', type: 'hillshade', source: 'dem', paint: { 'hillshade-exaggeration': 0.35 } }, map.getLayer('building') ? 'building' : undefined);
  if (map.getLayer('building-3d')) map.setPaintProperty('building-3d', 'fill-extrusion-opacity', 0.85);
  map.setSky?.({ 'sky-color': '#CFE3F0', 'horizon-color': '#FBF3E4', 'sky-horizon-blend': 0.6 });
  if (home) {
    const el = document.createElement('div'); el.className = 'home'; el.title = params.get('label') || tr('Your home');
    new maplibregl.Marker({ element: el }).setLngLat(home).setPopup(new maplibregl.Popup({ offset: 14 }).setText(params.get('label') || tr('Your home'))).addTo(map);
  }
  await show(current).catch(() => { document.getElementById('legend').innerHTML = '<b>Hazard layers are not built on this server.</b> Run scripts/build-map-layers.py.'; });
  map.flyTo({ ...view, duration: 3500, essential: true });
});


// Tap-to-inspect: the parcel (LA County Assessor), mapped hazards, combined index and City records at that point.
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const card = document.getElementById('card');
const title = t => t.replace(/\b([A-Z])([A-Z']+)\b/g, (m, a, b) => a + b.toLowerCase()).replace(/\b(Ca)\b/, 'CA');
function outline(rings) {
  const data = { type: 'FeatureCollection', features: rings ? [{ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: rings } }] : [] };
  if (map.getSource('parcel')) return map.getSource('parcel').setData(data);
  map.addSource('parcel', { type: 'geojson', data });
  map.addLayer({ id: 'parcel-fill', type: 'fill', source: 'parcel', paint: { 'fill-color': '#17372E', 'fill-opacity': 0.18 } });
  map.addLayer({ id: 'parcel-halo', type: 'line', source: 'parcel', paint: { 'line-color': '#FFFFFF', 'line-width': 6 } });
  map.addLayer({ id: 'parcel-line', type: 'line', source: 'parcel', paint: { 'line-color': '#17372E', 'line-width': 3 } });
}
function closeCard() { card.style.display = 'none'; outline(null); }
async function inspect(lngLat) {
  document.getElementById('hint').style.opacity = 0;
  card.style.display = 'block';
  card.innerHTML = `<button class="x" aria-label="${tr('Close')}" onclick="closeCard()">×</button><h2>${tr('Looking this up…')}</h2><div class="muted">${tr('Parcel, hazard maps and City records.')}</div>`;
  let d;
  try { const r = await fetch(`${base}/api/public/point?lat=${lngLat.lat.toFixed(6)}&lon=${lngLat.lng.toFixed(6)}${TX[params.get('lang')] ? `&lang=${params.get('lang')}` : ''}`); d = await r.json(); if (!r.ok) throw new Error(d.error || r.status); }
  catch (e) { card.innerHTML = `<button class="x" aria-label="${tr('Close')}" onclick="closeCard()">×</button><h2>${tr('Could not look this up')}</h2><div class="muted">${esc(e.message)}</div>`; return; }
  const p = d.parcel, n = d.neighborhood;
  const dist = m => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;
  outline(p?.outline || null);
  const facts = p ? [p.use, p.yearBuilt && trv('built {year}', { year: p.yearBuilt }), p.sqft && trv('{sqft} sq ft', { sqft: p.sqft.toLocaleString() }), p.units > 1 && trv('{units} units', { units: p.units }), p.lotSqft && trv('lot {sqft} sq ft', { sqft: p.lotSqft.toLocaleString() })].filter(Boolean).join(' · ') : '';
  const c = d.combined, t = c ? c.score / c.max : 0;
  const scoreColor = t > 0.5 ? '#B3261A' : t > 0.2 ? '#E8641E' : t > 0 ? '#C49A12' : '#5E7C70';
  const mapped = (d.layers || []).filter(l => !/^(Not mapped|Minimal|Outside)/i.test(l.label || ''));
  const rec = d.records;
  card.innerHTML = `<button class="x" aria-label="${tr('Close')}" onclick="closeCard()">×</button>
    <h2>${esc(p?.address ? title(p.address.replace(/\s+GLENDALE CA \d{5}$/, '')) : p ? trv('Parcel {apn}', { apn: p.apn }) : tr('No parcel here'))}</h2>
    <div class="muted">${p ? `APN ${esc(p.apn)}${facts ? ' · ' + esc(facts) : ''}` : tr('This spot is a street or outside the parcel map.')}</div>
    ${!d.inCity ? `<div class="note">${tr('Outside Glendale pilot coverage: hazard layers are not checked here.')}</div>` : ''}
    ${c ? `<div class="k">${tr('COMBINED PLANNING INDEX')}</div><div style="margin-top:4px"><span class="score" style="background:${scoreColor}">${trv('{score} of {max}', { score: c.score, max: c.max })}</span>${c.parts.length ? c.parts.map(x => esc(tr(x.label)) + ' +' + x.points).join(', ') : tr('No mapped layer here. That is not the same as no risk.')}</div>` : ''}
    ${d.layers ? `<div class="k">${tr('MAPPED HAZARDS AT THIS POINT')}</div>${mapped.length ? mapped.map(l => `<div class="row"><span>${esc(tr(l.name))}</span><b>${esc(tr(l.label))}</b></div>`).join('') : `<div class="muted">${tr('None of the seven layers maps a hazard here.')}</div>`}` : ''}
    ${n ? `<div class="k">${tr('NEIGHBORHOOD AND ZONING')}</div>
      ${n.neighborhood ? `<div class="row"><span>${tr('Neighborhood')}</span><b>${esc(n.neighborhood)}</b></div>` : ''}
      ${n.zoning ? `<div class="row"><span>${tr('Zoning')}${n.zoning.nearbyMetres > 5 ? ` <span class="muted">${trv('(nearest, {m} m)', { m: n.zoning.nearbyMetres })}</span>` : ''}</span><b style="text-align:right">${esc(n.zoning.code)} · ${esc(n.zoning.description)}</b></div>` : ''}
      ${n.fireStation ? `<div class="row"><span>${tr('Fire station district')}</span><b>${esc(n.fireStation.name)} · ${dist(n.fireStation.m)}</b></div>` : n.fireDistrict ? `<div class="row"><span>${tr('Fire station district')}</span><b>${esc(n.fireDistrict)}</b></div>` : ''}
      ${n.schools.map((x, i) => `<div class="row"><span>${i ? '' : tr('Nearest schools')}</span><b>${esc(x.name)} · ${dist(x.m)}</b></div>`).join('')}
      ${n.hospital ? `<div class="row"><span>${tr('Nearest hospital')}</span><b style="text-align:right">${esc(n.hospital.name)} · ${dist(n.hospital.m)}</b></div>` : ''}
      ${n.historicDistrict ? `<div class="row"><span>${tr('Historic district')}</span><b>${esc(n.historicDistrict.name)}</b></div>` : ''}
      ${n.notes.map(x => `<div class="note">${esc(x)}</div>`).join('')}` : ''}
    ${p?.notes?.length ? `<div class="k">${tr('WHAT THE BUILD YEAR MEANS')}</div>${p.notes.map(n => `<div class="note">${esc(n)}</div>`).join('')}` : ''}
    ${rec ? `<div class="k">${tr('CITY RECORDS FOR THIS PARCEL')}</div><div>${trv('{permits} permits · {inspections} inspections', rec.totals)}${rec.totals.codeCases ? ` · ${trv('{n} code cases', { n: rec.totals.codeCases })}` : ''}</div>
      ${rec.recent.slice(0, 3).map(r => `<div class="row"><span>${esc(r.type.length > 70 ? r.type.slice(0, 68) + '…' : r.type)}${r.description ? `<br><span class="muted">${esc(r.description.length > 90 ? r.description.slice(0, 88) + '…' : r.description)}</span>` : ''}</span><span class="muted" style="white-space:nowrap">${esc(r.status || '')}<br>${esc(r.date || '')}</span></div>`).join('')}
      <a href="${esc(rec.searchUrl)}" target="_blank" rel="noopener">${tr('Open in Glendale Permits ↗')}</a>` : ''}
    <div class="muted" style="margin-top:10px;font-size:11px">${trv('Parcel: {source}. Records, zoning and districts: City of Glendale public permit search and GIS. Hazards: CAL FIRE, FEMA, CGS, DWR planning maps. Planning information, not an official determination.', { source: esc(p?.source || 'LA County Assessor') })}</div>`;
}
map.on('click', e => inspect(e.lngLat));
// Keyboard: the canvas already pans with arrow keys; Enter or Space inspects the lot at the centre.
map.getCanvas().addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inspect(map.getCenter()); } });
map.on('load', () => setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 6000));

select.onchange = () => show(select.value);
document.getElementById('reset').onclick = () => map.flyTo({ ...view, duration: 1500 });
let spinning = false;
const spinBtn = document.getElementById('spin');
function orbit() { if (!spinning) return; map.easeTo({ bearing: map.getBearing() + 30, duration: 4000, easing: t => t }); }
map.on('moveend', orbit);
spinBtn.onclick = () => { spinning = !spinning; spinBtn.setAttribute('aria-pressed', spinning); spinBtn.textContent = spinning ? tr('Stop') : tr('Orbit'); orbit(); };
map.on('mousedown', () => { if (spinning) spinBtn.click(); });
map.getCanvas().style.cursor = 'pointer';
map.on('touchstart', () => { if (spinning) spinBtn.click(); });
</script>
</body>
</html>
