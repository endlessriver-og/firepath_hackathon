name: production smoke test
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/smoke.sh https://firepath-ruddy.vercel.app
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The judges' path through the guided tour, in the runner's own Chrome.
      - run: CHROME=$(command -v google-chrome) node scripts/tour-check.mjs https://firepath-ruddy.vercel.app
      # A business signs up in Spanish, onboards to Home, then deletes the account.
      - run: CHROME=$(command -v google-chrome) node scripts/business-check.mjs https://firepath-ruddy.vercel.app
      # A household signs up in English, adds a member, onboards to Home, changes its password, then deletes the account.
      - run: CHROME=$(command -v google-chrome) node scripts/household-check.mjs https://firepath-ruddy.vercel.app
      # axe-core across the main screens, Armenian Home and both maps.
      - run: CHROME=$(command -v google-chrome) node scripts/a11y-check.mjs https://firepath-ruddy.vercel.app
      # Emergency steps and the saved plan still open with the network cut; the app is installable.
      - run: CHROME=$(command -v google-chrome) node scripts/offline-check.mjs https://firepath-ruddy.vercel.app
      # The same with the app in Armenian: translated Emergency steps must load with no signal too.
      - run: CHROME=$(command -v google-chrome) node scripts/offline-check.mjs https://firepath-ruddy.vercel.app hy
      # Checklist ticks made with the API cut off are kept and sent once it is back.
      - run: CHROME=$(command -v google-chrome) node scripts/offline-ticks-check.mjs https://firepath-ruddy.vercel.app
      - run: CHROME=$(command -v google-chrome) node scripts/installable-check.mjs https://firepath-ruddy.vercel.app
      # Every screen in all four languages at 320 and 390 px with the largest text: nothing spills out of its tile.
      - run: CHROME=$(command -v google-chrome) node scripts/layout-check.mjs https://firepath-ruddy.vercel.app 1.4
