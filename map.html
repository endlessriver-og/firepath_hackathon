<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FirePath hazard map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --ink: #17372E; --muted: #53655E; --green: #1D5B4D; --line: #E2E8E1; --bg: #F5F6F1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  body { display: flex; flex-direction: column; }
  #filters { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; background: #FFF; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  #filters::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #D5DDD5; background: #FFF; color: var(--ink); border-radius: 18px; padding: 7px 12px; font: 700 13px/1 inherit; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #FFF; }
  .chip .sw { width: 10px; height: 10px; border-radius: 3px; }
  .chip[disabled] { opacity: .45; cursor: default; }
  #map { flex: 1; min-height: 240px; }
  #legend { background: #FFF; border-top: 1px solid var(--line); padding: 10px 14px 12px; font-size: 12px; line-height: 1.45; max-height: 38%; overflow-y: auto; }
  #legend h2 { font-size: 11px; letter-spacing: .08em; margin: 0 0 6px; color: #367363; }
  .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .row .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .note { color: var(--muted); margin-top: 6px; }
  .leaflet-popup-content { font: 13px/1.4 -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="filters" role="group" aria-label="Map layers"></div>
<div id="map" role="region" aria-label="Glendale hazard map"></div>
<div id="legend" aria-live="polite"></div>
<script>
const LAYERS = {
  wildfire: { name: 'Wildfire', colors: { 3: '#B3261A', 2: '#E8641E', 1: '#F5CF4A' }, levels: { 3: 'Very high', 2: 'High', 1: 'Moderate' } },
  flood: { name: 'Flood', colors: { 3: '#1F5FAD', 1: '#8DB9E8', unknown: '#AEB8C2' }, levels: { 3: '1% annual chance (special flood hazard area)', 1: '0.2% annual chance', unknown: 'Undetermined (Zone D, not studied)' } },
  fault: { name: 'Fault', colors: { zone: '#7B2D8B' }, levels: { zone: 'Earthquake fault zone' } },
  liquefaction: { name: 'Liquefaction', colors: { zone: '#B55FB0' }, levels: { zone: 'Liquefaction zone' } },
  landslide: { name: 'Landslide', colors: { zone: '#8C6D46' }, levels: { zone: 'Earthquake-induced landslide zone' } },
  dam_inundation: { name: 'Dam inundation', colors: { zone: '#1C9C9C' }, levels: { zone: 'Dam failure planning area' } },
  debris_flow: { name: 'Debris flow', colors: { zone: '#5E4526' }, levels: { zone: 'Post-fire assessment basin' } },
};
const PLACES = { fire_stations: ['Fire stations', '#C8361D'], hospitals: ['Hospitals', '#1F5FAD'], schools: ['Schools', '#2E7D4F'] };
const params = new URLSearchParams(location.search);
const active = new Set((params.get('layers') || 'wildfire').split(',').filter(k => LAYERS[k] || PLACES[k]));
const home = Number.isFinite(parseFloat(params.get('lat'))) ? [parseFloat(params.get('lat')), parseFloat(params.get('lon'))] : null;
const base = params.get('api') || '';
let manifest = { layers: {} };
const cache = {}, drawn = {};

const map = L.map('map', { zoomControl: true, attributionControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap contributors' }).addTo(map);
const escape = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

async function geo(key) {
  if (!cache[key]) cache[key] = fetch(`${base}/map-layers/${key}.geojson`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  return cache[key];
}

async function draw(key) {
  const data = await geo(key);
  if (LAYERS[key]) {
    const spec = LAYERS[key];
    drawn[key] = L.geoJSON(data, {
      style: f => ({ color: spec.colors[f.properties.level], weight: 1, fillColor: spec.colors[f.properties.level], fillOpacity: { 3: 0.55, 2: 0.45, 1: 0.3 }[f.properties.level] ?? 0.38 }),
      onEachFeature: (f, layer) => layer.bindPopup(`<b>${escape(f.properties.label)}</b><br>${escape(manifest.layers[key]?.source || '')}<br><span style="color:#64756E">Planning map, not a live incident or evacuation order.</span>`),
    }).addTo(map);
  } else {
    const [kind, color] = PLACES[key];
    drawn[key] = L.geoJSON(data, { pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 6, color: '#FFF', weight: 2, fillColor: color, fillOpacity: 1 }).bindPopup(`<b>${escape(f.properties.name)}</b><br>${kind.slice(0, -1)}`) }).addTo(map);
  }
  homeMarker?.bringToFront?.();
}

function renderFilters() {
  const chips = [...Object.entries(LAYERS).map(([k, v]) => [k, v.name, Object.values(v.colors)[0]]), ...Object.entries(PLACES).map(([k, [name, color]]) => [k, name, color])];
  document.getElementById('filters').innerHTML = chips.map(([k, name, color]) => {
    const empty = LAYERS[k] && manifest.layers[k] && manifest.layers[k].features === 0;
    return `<button class="chip" data-key="${k}" aria-pressed="${active.has(k)}" ${empty ? 'disabled title="No current assessment covers Glendale"' : ''}><span class="sw" style="background:${color}"></span>${name}${empty ? ' · none' : ''}</button>`;
  }).join('');
}

function renderLegend() {
  const rows = [...active].filter(k => LAYERS[k]).map(k => {
    const spec = LAYERS[k];
    return `<h2>${spec.name.toUpperCase()}</h2>` + Object.entries(spec.levels).map(([lvl, label]) => `<div class="row"><span class="sw" style="background:${spec.colors[lvl]}"></span>${label}</div>`).join('') + (['fault', 'liquefaction', 'landslide', 'dam_inundation'].includes(k) ? '<div class="note">This map has no severity levels; being inside the zone is the signal.</div>' : '');
  });
  document.getElementById('legend').innerHTML = (rows.length ? rows.join('') : '<div class="note">Choose a layer above to shade its zones.</div>') +
    `<div class="note">Planning maps (snapshot ${escape(manifest.snapshot || '')}), not live incidents or evacuation orders. Outside a shaded zone does not mean no risk. Map tiles load from OpenStreetMap.</div>`;
}

document.getElementById('filters').addEventListener('click', async event => {
  const chip = event.target.closest('.chip');
  if (!chip || chip.disabled) return;
  const key = chip.dataset.key;
  if (active.has(key)) { active.delete(key); drawn[key]?.remove(); delete drawn[key]; }
  else { active.add(key); await draw(key); }
  renderFilters(); renderLegend();
  parent?.postMessage?.({ type: 'firepath-map-layers', layers: [...active] }, '*');
});

let homeMarker = null;
(async () => {
  try { manifest = await fetch(`${base}/map-layers/manifest.json`).then(r => r.json()); } catch {}
  renderFilters(); renderLegend();
  try {
    const city = L.geoJSON(await geo('city_boundary'), { style: { color: '#1D5B4D', weight: 2, fill: false, dashArray: '6 4' }, interactive: false }).addTo(map);
    map.fitBounds(city.getBounds(), { padding: [8, 8], animate: false });
  } catch { map.setView([34.17, -118.25], 12); document.getElementById('legend').insertAdjacentHTML('afterbegin', '<div class="note"><b>Map layers are not built on this server.</b> Run scripts/build-map-layers.py.</div>'); }
  if (home) { homeMarker = L.circleMarker(home, { radius: 9, color: '#FFF', weight: 3, fillColor: '#17372E', fillOpacity: 1 }).addTo(map).bindTooltip('Your home', { permanent: true, direction: 'top', offset: [0, -8] }); map.setView(home, 14, { animate: false }); }
  for (const key of active) await draw(key).catch(() => {});
})();
</script>
</body>
</html>
