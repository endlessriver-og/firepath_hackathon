<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FirePath hazard map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --ink: #17372E; --muted: #53655E; --green: #1D5B4D; --line: #E2E8E1; --bg: #F5F6F1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  body { display: flex; flex-direction: column; }
  #filters { display: flex; gap: 8px; padding: 8px 10px; background: #FFF; border-bottom: 1px solid var(--line); }
  #filters select { flex: 1; min-width: 0; font: 700 14px/1.2 inherit; color: var(--ink); background: #FFF; border: 1px solid #C9D4CC; border-radius: 10px; padding: 8px 10px; }
  #map { flex: 1; min-height: 240px; }
  #legend { background: #FFF; border-top: 1px solid var(--line); padding: 10px 14px 12px; font-size: 12px; line-height: 1.45; max-height: 16%; overflow-y: auto; }
  #legend h2 { font-size: 11px; letter-spacing: .08em; margin: 0 0 6px; color: #367363; }
  .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .row .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .note { color: var(--muted); margin-top: 6px; }
  .leaflet-popup-content { font: 13px/1.4 -apple-system, sans-serif; max-height: 145px; overflow-y: auto; }
  @media (max-width: 500px) { .leaflet-popup { max-width: min(260px, 72vw); } #legend { max-height: 14%; } }
</style>
</head>
<body>
<div id="filters" role="group" aria-label="Map layers"></div>
<div id="map" role="region" aria-label="Glendale hazard map"></div>
<div id="legend" aria-live="polite"></div>
<script>
const COMBINED = { name: 'Combined', color: 'linear-gradient(90deg,#F5CF4A,#E8641E,#B3261A)' };
const LAYERS = {
  wildfire: { name: 'Wildfire', colors: { 3: '#B3261A', 2: '#E8641E', 1: '#F5CF4A' }, levels: { 3: 'Very high', 2: 'High', 1: 'Moderate' } },
  flood: { name: 'Flood', colors: { 3: '#1F5FAD', 1: '#8DB9E8', unknown: '#AEB8C2' }, levels: { 3: '1% annual chance (special flood hazard area)', 1: '0.2% annual chance', unknown: 'Undetermined (Zone D, not studied)' } },
  fault: { name: 'Fault', colors: { zone: '#7B2D8B' }, levels: { zone: 'Earthquake fault zone' } },
  liquefaction: { name: 'Liquefaction', colors: { zone: '#B55FB0' }, levels: { zone: 'Liquefaction zone' } },
  landslide: { name: 'Landslide', colors: { zone: '#8C6D46' }, levels: { zone: 'Earthquake-induced landslide zone' } },
  dam_inundation: { name: 'Dam inundation', colors: { zone: '#1C9C9C' }, levels: { zone: 'Dam failure planning area' } },
  debris_flow: { name: 'Debris flow', colors: { zone: '#5E4526' }, levels: { zone: 'Post-fire assessment basin' } },
};
const PLACES = { fire_stations: ['Fire stations', '#C8361D'], hospitals: ['Hospitals', '#1F5FAD'], schools: ['Schools', '#2E7D4F'] };
const params = new URLSearchParams(location.search);
// Labels in the app's language (drafts, unreviewed); English is the source text and the fallback.
const TX = {"es": {"Wildfire": "Incendio forestal", "Flood": "Inundación", "Fault": "Falla sísmica", "Liquefaction": "Licuefacción", "Landslide": "Deslizamiento", "Dam inundation": "Inundación por presa", "Debris flow": "Flujo de escombros", "Fire stations": "Estaciones de bomberos", "Hospitals": "Hospitales", "Schools": "Escuelas", "No hazard layer": "Sin capa de riesgo", "No places": "Sin lugares", "Combined index": "Índice combinado", "COMBINED PLANNING INDEX": "ÍNDICE COMBINADO DE PLANIFICACIÓN", "lower → higher": "menor → mayor", "Tap for a breakdown. Illustrative FirePath index, not an official risk score.": "Toque para ver el desglose. Índice ilustrativo de FirePath, no una calificación oficial de riesgo.", "Very high": "Muy alto", "High": "Alto", "Moderate": "Moderado", "Pick a hazard layer above to shade its zones.": "Elija una capa de riesgo arriba para sombrear sus zonas.", "This map has no severity levels; being inside the zone is the signal.": "Este mapa no tiene niveles; estar dentro de la zona es la señal.", "Planning maps, not live incidents or evacuation orders. Outside a shaded zone does not mean no risk.": "Mapas de planificación, no incidentes en vivo ni órdenes de evacuación. Estar fuera de una zona no significa que no haya riesgo.", "Your home": "Su hogar", "This address": "Esta dirección"}, "hy": {"Wildfire": "Անտառային հրդեհ", "Flood": "Ջրհեղեղ", "Fault": "Խզվածք", "Liquefaction": "Հողի հեղուկացում", "Landslide": "Սողանք", "Dam inundation": "Ամբարտակի ողողում", "Debris flow": "Սելավ", "Fire stations": "Հրշեջ կայաններ", "Hospitals": "Հիվանդանոցներ", "Schools": "Դպրոցներ", "No hazard layer": "Առանց վտանգի շերտի", "No places": "Առանց վայրերի", "Combined index": "Համակցված ցուցիչ", "COMBINED PLANNING INDEX": "ՊԼԱՆԱՎՈՐՄԱՆ ՀԱՄԱԿՑՎԱԾ ՑՈՒՑԻՉ", "lower → higher": "ցածր → բարձր", "Tap for a breakdown. Illustrative FirePath index, not an official risk score.": "Հպեք՝ մանրամասների համար։ FirePath-ի պատկերավոր ցուցիչ է, ոչ թե պաշտոնական գնահատական։", "Very high": "Շատ բարձր", "High": "Բարձր", "Moderate": "Միջին", "Pick a hazard layer above to shade its zones.": "Ընտրեք վտանգի շերտ վերևում՝ դրա գոտիները ցույց տալու համար։", "This map has no severity levels; being inside the zone is the signal.": "Այս քարտեզը մակարդակներ չունի. գոտում լինելն է ազդանշանը։", "Planning maps, not live incidents or evacuation orders. Outside a shaded zone does not mean no risk.": "Պլանավորման քարտեզներ են, ոչ թե ընթացիկ դեպքեր կամ տարհանման հրամաններ։ Գոտուց դուրս լինելը չի նշանակում, որ վտանգ չկա։", "Your home": "Ձեր տունը", "This address": "Այս հասցեն"}, "ko": {"Wildfire": "산불", "Flood": "홍수", "Fault": "단층", "Liquefaction": "액상화", "Landslide": "산사태", "Dam inundation": "댐 범람", "Debris flow": "토석류", "Fire stations": "소방서", "Hospitals": "병원", "Schools": "학교", "No hazard layer": "위험 지도 없음", "No places": "장소 없음", "Combined index": "종합 지수", "COMBINED PLANNING INDEX": "종합 계획 지수", "lower → higher": "낮음 → 높음", "Tap for a breakdown. Illustrative FirePath index, not an official risk score.": "눌러서 세부 내용을 보세요. FirePath 참고용 지수이며 공식 위험 점수가 아닙니다.", "Very high": "매우 높음", "High": "높음", "Moderate": "보통", "Pick a hazard layer above to shade its zones.": "위에서 위험 지도를 고르면 해당 구역이 표시됩니다.", "This map has no severity levels; being inside the zone is the signal.": "이 지도에는 등급이 없으며, 구역 안에 있는지가 기준입니다.", "Planning maps, not live incidents or evacuation orders. Outside a shaded zone does not mean no risk.": "실시간 사고나 대피 명령이 아닌 계획용 지도입니다. 구역 밖이라고 위험이 없는 것은 아닙니다.", "Your home": "우리 집", "This address": "이 주소"}};
const tr = text => (TX[params.get('lang')] || {})[text] || text;
if (TX[params.get('lang')]) document.documentElement.lang = params.get('lang');
const active = new Set((params.get('layers') || 'combined').split(',').filter(k => k === 'combined' || LAYERS[k] || PLACES[k]));
const home = Number.isFinite(parseFloat(params.get('lat'))) ? [parseFloat(params.get('lat')), parseFloat(params.get('lon'))] : null;
const base = params.get('api') || '';
let manifest = { layers: {} };
const cache = {}, drawn = {};

const map = L.map('map', { zoomControl: true, attributionControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap contributors' }).addTo(map);
const escape = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

async function geo(key) {
  if (!cache[key]) cache[key] = fetch(`${base}/map-layers/${key}.geojson`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  return cache[key];
}

let combined = null;
async function drawCombined() {
  combined = combined || await fetch(`${base}/map-layers/combined.json`).then(r => r.json());
  // Each ~150 m cell is coloured by its own score (no summing across neighbours, which would overstate
  // danger). Canvas rendering keeps ~3,000 squares fast; soft edges come from the low stroke-free opacity.
  const stops = [[0, [245, 207, 74]], [0.45, [232, 100, 30]], [0.75, [179, 38, 26]], [1, [110, 16, 12]]];
  const colorFor = t => { for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) { const [a, ca] = stops[i - 1], [b, cb] = stops[i]; const f = (t - a) / (b - a); return `rgb(${ca.map((v, j) => Math.round(v + (cb[j] - v) * f)).join(',')})`; } return 'rgb(110,16,12)'; };
  const renderer = L.canvas({ padding: 0.3 });
  const half = combined.grid_m / 2, dLat = half / 110540, dLon = half / (111320 * Math.cos(34.17 * Math.PI / 180));
  drawn.combined = L.layerGroup(combined.cells.map(([lat, lon, score]) => L.rectangle([[lat - dLat, lon - dLon], [lat + dLat, lon + dLon]], { renderer, stroke: false, fillColor: colorFor(score / combined.max), fillOpacity: 0.28 + 0.42 * (score / combined.max), interactive: false }))).addTo(map);
}

// Tap anywhere: explain the combined score of the nearest grid cell.
map.on('click', event => {
  if (!active.has('combined') || !combined) return;
  const { lat, lng } = event.latlng;
  let best = null, bestD = Infinity;
  for (const cell of combined.cells) { const d = (cell[0] - lat) ** 2 + ((cell[1] - lng) * 0.83) ** 2; if (d < bestD) { bestD = d; best = cell; } }
  const metres = Math.sqrt(bestD) * 111000;
  const body = !best || metres > combined.grid_m ? '<b>Combined index: 0</b><br>No mapped layer covers this spot. That is not the same as no risk.'
    : `<b>Combined index: ${best[2]} of ${combined.max}</b><br>` + best[3].split(',').map(c => `${escape(combined.labels[c])} +${combined.weights[c]}`).join('<br>');
  L.popup().setLatLng(event.latlng).setContent(`${body}<br><span style="color:#64756E">FirePath planning index with illustrative weights, not an official risk score.</span>`).openOn(map);
});

async function draw(key) {
  if (key === 'combined') return drawCombined();
  const data = await geo(key);
  if (LAYERS[key]) {
    const spec = LAYERS[key];
    drawn[key] = L.geoJSON(data, {
      style: f => ({ color: spec.colors[f.properties.level], weight: 1, fillColor: spec.colors[f.properties.level], fillOpacity: { 3: 0.55, 2: 0.45, 1: 0.3 }[f.properties.level] ?? 0.38 }),
      onEachFeature: (f, layer) => layer.bindPopup(`<b>${escape(f.properties.label)}</b><br>${escape(manifest.layers[key]?.source || '')}<br><span style="color:#64756E">Planning map, not a live incident or evacuation order.</span>`),
    }).addTo(map);
  } else {
    const [kind, color] = PLACES[key];
    drawn[key] = L.geoJSON(data, { pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 6, color: '#FFF', weight: 2, fillColor: color, fillOpacity: 1 }).bindPopup(`<b>${escape(f.properties.name)}</b><br>${kind.slice(0, -1)}`) }).addTo(map);
  }
  homeMarker?.bringToFront?.();
}

// Two dropdowns: one hazard layer at a time, plus optional places (stations, hospitals, schools).
function renderFilters() {
  const hazard = [...active].find(k => k === 'combined' || LAYERS[k]) || '';
  const place = [...active].find(k => PLACES[k]) || '';
  const opt = (k, name, on, disabled) => `<option value="${k}" ${on ? 'selected' : ''} ${disabled ? 'disabled' : ''}>${name}</option>`;
  document.getElementById('filters').innerHTML =
    `<select id="hazard" aria-label="Hazard layer">${opt('', tr('No hazard layer'), !hazard)}${opt('combined', tr('Combined index'), hazard === 'combined')}${Object.entries(LAYERS).map(([k, v]) => { const empty = manifest.layers[k] && manifest.layers[k].features === 0; return opt(k, tr(v.name) + (empty ? ' (none in Glendale)' : ''), hazard === k, empty); }).join('')}</select>` +
    `<select id="place" aria-label="Places">${opt('', tr('No places'), !place)}${Object.entries(PLACES).map(([k, [name]]) => opt(k, tr(name), place === k)).join('')}</select>`;
}

function renderLegend() {
  const combinedRow = active.has('combined') ? `<h2>${tr('COMBINED PLANNING INDEX')}</h2><div class="row"><span class="sw" style="width:120px;background:${COMBINED.color}"></span>${tr('lower → higher')}</div><div class="note">${tr('Tap for a breakdown. Illustrative FirePath index, not an official risk score.')}</div>` : '';
  const rows = [...active].filter(k => LAYERS[k]).map(k => {
    const spec = LAYERS[k];
    return `<h2>${tr(spec.name).toUpperCase()}</h2>` + Object.entries(spec.levels).map(([lvl, label]) => `<div class="row"><span class="sw" style="background:${spec.colors[lvl]}"></span>${tr(label)}</div>`).join('') + (['fault', 'liquefaction', 'landslide', 'dam_inundation'].includes(k) ? `<div class="note">${tr('This map has no severity levels; being inside the zone is the signal.')}</div>` : '');
  });
  document.getElementById('legend').innerHTML = (combinedRow + rows.join('') || `<div class="note">${tr('Pick a hazard layer above to shade its zones.')}</div>`) +
    `<div class="note">${tr('Planning maps, not live incidents or evacuation orders. Outside a shaded zone does not mean no risk.')} (${escape(manifest.snapshot || '')}) · OpenStreetMap</div>`;
}

document.getElementById('filters').addEventListener('change', async event => {
  const group = event.target.id === 'hazard' ? k => k === 'combined' || LAYERS[k] : k => PLACES[k];
  for (const k of [...active].filter(group)) { active.delete(k); drawn[k]?.remove(); delete drawn[k]; }
  if (event.target.value) { active.add(event.target.value); await draw(event.target.value); }
  renderFilters(); renderLegend();
  parent?.postMessage?.({ type: 'firepath-map-layers', layers: [...active] }, '*');
});

let homeMarker = null;
(async () => {
  try { manifest = await fetch(`${base}/map-layers/manifest.json`).then(r => r.json()); } catch {}
  renderFilters(); renderLegend();
  try {
    const city = L.geoJSON(await geo('city_boundary'), { style: { color: '#1D5B4D', weight: 2, fill: false, dashArray: '6 4' }, interactive: false }).addTo(map);
    map.fitBounds(city.getBounds(), { padding: [8, 8], animate: false });
  } catch { map.setView([34.17, -118.25], 12); document.getElementById('legend').insertAdjacentHTML('afterbegin', '<div class="note"><b>Map layers are not built on this server.</b> Run scripts/build-map-layers.py.</div>'); }
  if (home) { homeMarker = L.circleMarker(home, { radius: 9, color: '#FFF', weight: 3, fillColor: '#17372E', fillOpacity: 1 }).addTo(map).bindTooltip(escape(params.get('label') || tr('Your home')), { permanent: true, direction: 'top', offset: [0, -8] }); map.setView(home, 14, { animate: false }); }
  for (const key of active) await draw(key).catch(() => {});
})();
</script>
</body>
</html>
