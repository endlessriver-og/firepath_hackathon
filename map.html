  .row .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .note { color: var(--muted); margin-top: 6px; }
  .leaflet-popup-content { font: 13px/1.4 -apple-system, sans-serif; max-height: 145px; overflow-y: auto; }

"지진 단층 구역", "Liquefaction zone": "액상화 구역", "Earthquake-induced landslide zone": "지진 유발 산사태 구역", "Dam failure planning area": "댐 붕괴 대비 구역", "Post-fire assessment basin": "산불 후 평가 유역", " (none in Glendale)": " (글렌데일에 없음)", "Fire station": "소방서", "Hospital": "병원", "School": "학교", "Combined index: 0": "종합 지수: 0", "Combined index: {score} of {max}": "종합 지수: {max}점 중 {score}점", "No mapped layer covers this spot. That is not the same as no risk.": "이 지점을 포함하는 지도는 없습니다. 위험이 없다는 뜻은 아닙니다.", "FirePath planning index with illustrative weights, not an official risk score.": "예시 가중치를 쓴 FirePath 계획 지수이며 공식 위험 점수가 아닙니다.", "Planning map, not a live incident or evacuation order.": "실시간 사고나 대피 명령이 아닌 계획용 지도입니다.", "Moderate fire hazard severity zone": "산불 위험 보통 구역", "High fire hazard severity zone": "산불 위험 높음 구역", "Very high fire hazard severity zone": "산불 위험 매우 높음 구역", "Zone D, flood hazard undetermined (not studied)": "D 구역, 홍수 위험 미정 (조사 안 됨)", "Zone X, 0.2% annual chance flood area": "X 구역, 연간 0.2% 확률 홍수 구역", "Special flood hazard area, Zone A (1% annual chance)": "특별 홍수 위험 구역, A 구역 (연간 1% 확률)", "Alquist-Priolo earthquake fault zone": "앨퀴스트-프리올로 지진 단층 구역", "Seismic hazard zone: liquefaction": "지진 위험 구역: 액상화", "Seismic hazard zone: earthquake-induced landslide": "지진 위험 구역: 지진 유발 산사태", "Dam inundation planning area: ": "댐 범람 대비 구역: ", "Wildfire Very high": "산불 매우 높음", "Wildfire High": "산불 높음", "Wildfire Moderate": "산불 보통", "Within 400 m of a High/Very high fire zone": "산불 높음/매우 높음 구역에서 400m 이내", "Within 800 m of a High/Very high fire zone": "산불 높음/매우 높음 구역에서 800m 이내", "Special flood hazard area": "특별 홍수 위험 구역", "0.2% annual chance flood area": "연간 0.2% 확률 홍수 구역", "Landslide zone": "산사태 구역", "Dam inundation area": "댐 범람 구역", "FirePath Glendale hazard map": "FirePath 글렌데일 위험 지도", "Map layers": "지도 레이어", "Legend": "범례", "Hazard layer": "위험 레이어", "Places": "장소", "Glendale hazard map. Arrow keys pan; press Enter for the combined index at the centre.": "글렌데일 위험 지도. 화살표 키로 이동하고 Enter를 누르면 가운데 지점의 종합 지수를 볼 수 있습니다."}};
// ?lang= from the app; opened directly, use the first device language the page has (else English).
const LANG = params.get('lang') || (navigator.languages || [navigator.language || '']).map(l => String(l).toLowerCase().split('-')[0]).find(l => TX[l]) || 'en';
const tr = text => (TX[LANG] || {})[text] || text;
const trv = (text, vars) => tr(text).replace(/\{(\w+)\}/g, (_, k) => vars[k]);
// Layer data labels; dam areas carry their dam's name after a fixed prefix.
const DAM = 'Dam inundation planning area: ';
const featureLabel = label => String(label || '').startsWith(DAM) ? tr(DAM) + label.slice(DAM.length) : tr(label);
if (TX[LANG]) document.documentElement.lang = LANG;
// Screen-reader labels in the same language.
document.querySelector('h1.sr').textContent = tr('FirePath Glendale hazard map');
for (const [id, label] of [['filters', 'Map layers'], ['map', 'Glendale hazard map. Arrow keys pan; press Enter for the combined index at the centre.'], ['legend', 'Legend']]) document.getElementById(id).setAttribute('aria-label', tr(label));
const active = new Set((params.get('layers') || 'combined').split(',').filter(k => k === 'combined' || LAYERS[k] || PLACES[k]));
const home = Number.isFinite(parseFloat(params.get('lat'))) ? [parseFloat(params.get('lat')), parseFloat(params.get('lon'))] : null;
const base = params.get('api') || '';
let manifest = { layers: {} };
const cache = {}, drawn = {};

const map = L.map('map', { zoomControl: true, attributionControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap contributors' }).addTo(map);
const escape = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

async function geo(key) {
  if (!cache[key]) cache[key] = fetch(`${base}/map-layers/${key}.geojson`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  return cache[key];
}

let combined = null;
async function drawCombined() {
  combined = combined || await fetch(`${base}/map-layers/combined.json`).then(r => r.json());
  // Each ~150 m cell is coloured by its own score (no summing across neighbours, which would overstate
  // danger). Canvas rendering keeps ~3,000 squares fast; soft edges come from the low stroke-free opacity.
  const stops = [[0, [245, 207, 74]], [0.45, [232, 100, 30]], [0.75, [179, 38, 26]], [1, [110, 16, 12]]];
  const colorFor = t => { for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) { const [a, ca] = stops[i - 1], [b, cb] = stops[i]; const f = (t - a) / (b - a); return `rgb(${ca.map((v, j) => Math.round(v + (cb[j] - v) * f)).join(',')})`; } return 'rgb(110,16,12)'; };
  const renderer = L.canvas({ padding: 0.3 });
  const half = combined.grid_m / 2, dLat = half / 110540, dLon = half / (111320 * Math.cos(34.17 * Math.PI / 180));
  drawn.combined = L.layerGroup(combined.cells.map(([lat, lon, score]) => L.rectangle([[lat - dLat, lon - dLon], [lat + dLat, lon + dLon]], { renderer, stroke: false, fillColor: colorFor(score / combined.max), fillOpacity: 0.28 + 0.42 * (score / combined.max), interactive: false }))).addTo(map);
}

// Tap anywhere: explain the combined score of the nearest grid cell.
// Keyboard: the map already pans with arrow keys; Enter or Space opens the breakdown at the centre.
map.getContainer().addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === map.getContainer()) { e.preventDefault(); map.fire('click', { latlng: map.getCenter() }); } });
map.on('click', event => {
  if (!active.has('combined') || !combined) return;
  const { lat, lng } = event.latlng;
  let best = null, bestD = Infinity;
  for (const cell of combined.cells) { const d = (cell[0] - lat) ** 2 + ((cell[1] - lng) * 0.83) ** 2; if (d < bestD) { bestD = d; best = cell; } }
  const metres = Math.sqrt(bestD) * 111000;
  const body = !best || metres > combined.grid_m ? `<b>${tr('Combined index: 0')}</b><br>${tr('No mapped layer covers this spot. That is not the same as no risk.')}`
    : `<b>${trv('Combined index: {score} of {max}', { score: best[2], max: combined.max })}</b><br>` + best[3].split(',').map(c => `${escape(tr(combined.labels[c]))} +${combined.weights[c]}`).join('<br>');
  L.popup().setLatLng(event.latlng).setContent(`${body}<br><span style="color:#64756E">${tr('FirePath planning index with illustrative weights, not an official risk score.')}</span>`).openOn(map);
});

async function draw(key) {
  if (key === 'combined') return drawCombined();
  const data = await geo(key);
  if (LAYERS[key]) {
    const spec = LAYERS[key];
    drawn[key] = L.geoJSON(data, {
      style: f => ({ color: spec.colors[f.properties.level], weight: 1, fillColor: spec.colors[f.properties.level], fillOpacity: { 3: 0.55, 2: 0.45, 1: 0.3 }[f.properties.level] ?? 0.38 }),
      onEachFeature: (f, layer) => layer.bindPopup(`<b>${escape(featureLabel(f.properties.label))}</b><br>${escape(manifest.layers[key]?.source || '')}<br><span style="color:#64756E">${tr('Planning map, not a live incident or evacuation order.')}</span>`),
    }).addTo(map);
  } else {
    const [kind, color] = PLACES[key];
    drawn[key] = L.geoJSON(data, { pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 6, color: '#FFF', weight: 2, fillColor: color, fillOpacity: 1 }).bindPopup(`<b>${escape(f.properties.name)}</b><br>${tr(kind.slice(0, -1))}`) }).addTo(map);
  }
  homeMarker?.bringToFront?.();
}

// Two dropdowns: one hazard layer at a time, plus optional places (stations, hospitals, schools).
function renderFilters() {
  const hazard = [...active].find(k => k === 'combined' || LAYERS[k]) || '';
  const place = [...active].find(k => PLACES[k]) || '';
  const opt = (k, name, on, disabled) => `<option value="${k}" ${on ? 'selected' : ''} ${disabled ? 'disabled' : ''}>${name}</option>`;
  document.getElementById('filters').innerHTML =
    `<select id="hazard" aria-label="${tr('Hazard layer')}">${opt('', tr('No hazard layer'), !hazard)}${opt('combined', tr('Combined index'), hazard === 'combined')}${Object.entries(LAYERS).map(([k, v]) => { const empty = manifest.layers[k] && manifest.layers[k].features === 0; return opt(k, tr(v.name) + (empty ? tr(' (none in Glendale)') : ''), hazard === k, empty); }).join('')}</select>` +
    `<select id="place" aria-label="${tr('Places')}">${opt('', tr('No places'), !place)}${Object.entries(PLACES).map(([k, [name]]) => opt(k, tr(name), place === k)).join('')}</select>`;
}

function renderLegend() {
  const combinedRow = active.has('combined') ? `<h2>${tr('COMBINED PLANNING INDEX')}</h2><div class="row"><span class="sw" style="width:120px;background:${COMBINED.color}"></span>${tr('lower → higher')}</div><div class="note">${tr('Tap for a breakdown. Illustrative FirePath index, not an official risk score.')}</div>` : '';
  const rows = [...active].filter(k => LAYERS[k]).map(k => {
    const spec = LAYERS[k];
    return `<h2>${tr(spec.name).toUpperCase()}</h2>` + Object.entries(spec.levels).map(([lvl, label]) => `<div class="row"><span class="sw" style="background:${spec.colors[lvl]}"></span>${tr(label)}</div>`).join('') + (['fault', 'liquefaction', 'landslide', 'dam_inundation'].includes(k) ? `<div class="note">${tr('This map has no severity levels; being inside the zone is the signal.')}</div>` : '');
  });
  document.getElementById('legend').innerHTML = (combinedRow + rows.join('') || `<div class="note">${tr('Pick a hazard layer above to shade its zones.')}</div>`) +
    `<div class="note">${tr('Planning maps, not live incidents or evacuation orders. Outside a shaded zone does not mean no risk.')} (${escape(manifest.snapshot || '')}) · OpenStreetMap</div>`;
}

document.getElementById('filters').addEventListener('change', async event => {
  const group = event.target.id === 'hazard' ? k => k === 'combined' || LAYERS[k] : k => PLACES[k];
  for (const k of [...active].filter(group)) { active.delete(k); drawn[k]?.remove(); delete drawn[k]; }
  if (event.target.value) { active.add(event.target.value); await draw(event.target.value); }
  renderFilters(); renderLegend();
  parent?.postMessage?.({ type: 'firepath-map-layers', layers: [...active] }, '*');
});

let homeMarker = null;
(async () => {
  try { manifest = await fetch(`${base}/map-layers/manifest.json`).then(r => r.json()); } catch {}
  renderFilters(); renderLegend();
  try {
    const city = L.geoJSON(await geo('city_boundary'), { style: { color: '#1D5B4D', weight: 2, fill: false, dashArray: '6 4' }, interactive: false }).addTo(map);
    map.fitBounds(city.getBounds(), { padding: [8, 8], animate: false });
  } catch { map.setView([34.17, -118.25], 12); document.getElementById('legend').insertAdjacentHTML('afterbegin', '<div class="note"><b>Map layers are not built on this server.</b> Run scripts/build-map-layers.py.</div>'); }
  if (home) { homeMarker = L.circleMarker(home, { radius: 9, color: '#FFF', weight: 3, fillColor: '#17372E', fillOpacity: 1 }).addTo(map).bindTooltip(escape(params.get('label') || tr('Your home')), { permanent: true, direction: 'top', offset: [0, -8] }); map.setView(home, 14, { animate: false }); }
  for (const key of active) await draw(key).catch(() => {});
})();
</script>
